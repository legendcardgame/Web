<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control remoto</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#fff; padding:1rem; }
    button, input { font-size:1.2rem; margin:.3rem; padding:.5rem 1rem; }
    .row { margin:.5rem 0; }
    .muted { color:#9aa0a6; font-size:.9rem; }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Control del Temporizador</h1>

  <div class="row">
    <label>Minutos: <input id="minutes" type="number" value="50" min="0"></label>
    <button onclick="send({ type:'setTime', minutes: document.getElementById('minutes').value })">Aplicar</button>
  </div>

  <div class="row">
    <button onclick="send({ type:'start' })">▶️ Iniciar</button>
    <button onclick="send({ type:'pause' })">⏸️ Pausar</button>
    <button onclick="send({ type:'reset' })">🔄 Reiniciar</button>
  </div>

  <div class="row">
    <label>Ronda: <input id="rondaInput" type="text" placeholder="Número"></label>
    <button onclick="send({ type:'setRonda', text: 'Ronda ' + document.getElementById('rondaInput').value })">Guardar Ronda</button>
  </div>

  <div class="row">
    <label>Subir fondo: <input id="bgFile" type="file" accept="image/*"></label>
  </div>

  <p class="muted">Funciona desde cualquier red porque usa Firestore en la nube.</p>

  <script>
    // 🔑 Pega la misma configuración Firebase de index.html
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ROOM_ID = "default";
    const ref = db.collection('timers').doc(ROOM_ID);

    function send(obj) {
      ref.set(obj);
    }

    document.getElementById('bgFile').addEventListener('change', async (e) => {
      const file = e.target.files?.[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        send({ type:"setBackground", dataUrl: reader.result });
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
