<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Control remoto</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#fff; padding:1rem; }
    button, input { font-size:1.2rem; margin:.3rem; padding:.5rem 1rem; }
    .row { margin:.5rem 0; }
    .muted { color:#9aa0a6; font-size:.9rem; }
  </style>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore-compat.js"></script>
</head>
<body>
  <h1>Control del Temporizador</h1>

  <div class="row">
    <label>Minutos: <input id="minutes" type="number" value="50" min="0"></label>
    <button id="btnApply">Aplicar</button>
  </div>

  <div class="row">
    <button id="btnStart">▶️ Iniciar</button>
    <button id="btnPause">⏸️ Pausar</button>
    <button id="btnReset">🔄 Reiniciar</button>
  </div>

  <div class="row">
    <label>Ronda: <input id="rondaInput" type="text" placeholder="Número"></label>
    <button id="btnRonda">Guardar Ronda</button>
  </div>

  <p class="muted">El fondo se toma del archivo <code>fondo.png</code> en el HTML de proyección.</p>

  <script>
    // 🔑 Misma configuración que en index.html
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_AUTH_DOMAIN",
      projectId: "TU_PROJECT_ID",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const ROOM_ID = "default";
    const ref = db.collection('timers').doc(ROOM_ID);

    function send(obj) {
      ref.set(obj).then(()=>console.log('OK', obj)).catch(err=>{
        alert('Error Firestore: ' + err.message);
        console.error(err);
      });
    }

    // Botones
    document.getElementById('btnApply').addEventListener('click', ()=>{
      send({ type:'setTime', minutes: document.getElementById('minutes').value });
    });
    document.getElementById('btnStart').addEventListener('click', ()=> send({ type:'start' }));
    document.getElementById('btnPause').addEventListener('click', ()=> send({ type:'pause' }));
    document.getElementById('btnReset').addEventListener('click', ()=> send({ type:'reset' }));
    document.getElementById('btnRonda').addEventListener('click', ()=>{
      send({ type:'setRonda', text: 'Ronda ' + document.getElementById('rondaInput').value });
    });
  </script>
</body>
</html>
